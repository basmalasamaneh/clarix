        subjectName: { type: [string, "null"] }
        createdAt: { type: string }
        role: { type: [string, "null"] }
        count: { type: integer }
    SourceDetail:
      type: object
      required: [key, value, display, unit, formula, inputs, breakdown, rows, total, page, imports, issues, alternatives, notes, duplicatePairs]
      properties:
        key: { type: string }
        value: { type: [string, "null"] }
        display: { type: [string, "null"] }
        unit: { type: string }
        formula: { $ref: "#/components/schemas/SourceText" }
        inputs:
          type: array
          items:
            type: object
            required: [key, value, unit]
            properties:
              key: { type: string }
              value: { type: [string, "null"] }
              unit: { type: string }
        breakdown: { $ref: "#/components/schemas/SourceText" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/SourceText" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/SourceRow" }
        total: { type: integer }
        page: { type: integer }
        imports:
          type: array
          items:
            type: object
            required: [id, sourceName, orderId, approvedAt]
            properties:
              id: { type: string }
              sourceName: { type: string }
              orderId: { type: [string, "null"] }
              approvedAt: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/RunIssue" }
        alternatives:
          type: array
          items:
            type: object
            required: [key, metric, value, unit]
            properties:
              key: { type: string }
              metric: { type: string }
              value: { type: [string, "null"] }
              unit: { type: string }
        duplicatePairs:
          type: array
          items:
            type: object
            required: [original, suspected]
            properties:
              original: { $ref: "#/components/schemas/SourceRow" }
              suspected: { $ref: "#/components/schemas/SourceRow" }
