      type: object
      required: [id, importId, code, severity, severityStatus, sourceName, group, orderId, archived, superseded, refs, blockedReasons]
      properties:
        referenceCount:
          type: integer
          description: Total related source rows. refs and rows are previews of at most 20; use the paginated Source Drawer for complete rows.
        id: { type: string }
        importId: { type: string }
        code: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        severityStatus: { type: string, enum: [green, yellow, red] }
        sourceName: { type: string }
        group: { type: string }
        orderId: { type: [string, "null"] }
        approvedAt: { type: string }
        archived: { type: boolean }
        superseded: { type: boolean }
        comparable: { type: [boolean, "null"] }
        overallStatus: { type: [string, "null"], enum: [green, yellow, red, null] }
        groupStatuses:
          type: [object, "null"]
          additionalProperties: { type: string }
        blockedReasons:
          type: array
          items: { type: string }
        refs:
          type: array
          items:
            type: object
            required: [file, line]
