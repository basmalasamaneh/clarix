openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /platform/factories:
    get:
      operationId: getPlatformFactories
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Metadata only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformFactoryPage" }
    post:
      operationId: createPlatformFactory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryCreation" }
      responses:
        "201":
          description: Created with one-time invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformInvitationResult" }
  /platform/factories/{id}:
    patch:
      operationId: updatePlatformFactory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryAdministration" }
      responses:
        "200":
          description: Updated metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformFactory" }
  /platform/factories/{id}/invitation:
    post:
      operationId: managePlatformInvitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FirstManagerInvitationAction" }
      responses:
        "200":
          description: Invitation action result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformInvitationResult" }
  /platform/audit:
    get:
      operationId: getPlatformAudit
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Platform audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementAuditPage" }
  /factory-settings:
    get:
      operationId: getFactorySettings
      responses:
        "200":
          description: Own factory safe settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryPreferences" }
    put:
      operationId: saveFactorySettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactoryPreferences" }
      responses:
        "200":
          description: Saved for future checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactoryPreferences" }
  /factory-settings/audit:
    get:
      operationId: getFactorySettingsAudit
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Own settings audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagementAuditPage" }
  /overview:
    get:
      operationId: getOverview
      responses:
        "200":
          description: Active-factory overview using approved server results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "401":
          description: Sign in required
        "403":
          description: Factory membership required
  /members:
    get:
      operationId: getMembers
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Factory members
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Member" } }
                  total: { type: integer }
                  page: { type: integer }
  /members/{id}:
    patch:
      operationId: updateMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /members/invitations:
    get:
      operationId: getInvitations
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Pending invitations, including expired links
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
                  total: { type: integer }
                  page: { type: integer }
    post:
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: One-time link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationLink" }
  /members/invitations/{id}/revoke:
    post:
      operationId: revokeInvitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
  /members/invitations/{id}/reissue:
    post:
      operationId: reissueInvitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Replacement one-time link; old invitation revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationLink" }
  /members/audit:
    get:
      operationId: getMemberAudit
      responses:
        "200":
          description: Latest 50 factory account audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountAudit" }
  /auth/invitation:
    get:
      operationId: getInvitationDetails
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Valid invitation only; invalid tokens return neutral 404
          content:
            application/json:
              schema:
                type: object
                required: [factoryName, role, email, expiresAt]
                properties:
                  factoryName: { type: string }
                  role: { type: string, enum: [platform_admin, factory_manager, analyst, viewer] }
                  email: { type: string }
                  expiresAt: { type: string }
    post:
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptance" }
      responses:
        "200":
          description: Accepted and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "200":
          description: Password changed, other sessions invalidated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout-everywhere:
    post:
      operationId: logoutEverywhere
      responses:
        "204": { description: All sessions invalidated }
  /runs:
    get:
      operationId: listProductionRuns
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [green, yellow, red] } }
        - { name: sort, in: query, schema: { type: string, enum: [order, status] } }
      responses:
        "200":
          description: Current approved active runs
          content:
            application/json:
              schema:
                type: object
                required: [items, page, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ProductionRun" } }
                  page: { type: integer }
                  total: { type: integer }
  /runs/{id}:
    get:
      operationId: getProductionRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Factory-scoped current run and metric lineage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductionRun" }
        "404": { description: Not found }
  /comparison:
    get:
      operationId: getRunComparison
      parameters:
        - { name: a, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: b, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: B minus A, refusing only blocked metric groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunComparison" }
        "404": { description: Not found }
  /quality:
    get:
      operationId: getQuality
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: severity, in: query, schema: { type: string, enum: [info, warning, error] } }
        - { name: group, in: query, schema: { type: string, enum: [volume, changeover, downtime, file, import, all] } }
        - { name: order, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: includeArchived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Approved issue history and current-order counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityPage" }
  /quality/{id}:
    get:
      operationId: getQualityIssue
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Approved issue with exact source cells
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityIssue" }
        "404":
          description: Not found in this factory
  /imports:
    get:
      operationId: listImports
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Factory import page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPage" }
    post:
      operationId: createImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportInput" }
      responses:
        "201":
          description: Draft and short-lived direct upload URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/config:
    get:
      operationId: getImportConfig
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportLimits" }
  /imports/{id}:
    get:
      operationId: getImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Draft or completed import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/finalize:
    post:
      operationId: finalizeImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Parsed originals and suggested mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/mapping:
    put:
      operationId: saveImportMapping
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingInput" }
      responses:
        "200":
          description: Saved draft mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/check:
    post:
      operationId: checkImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Checked import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/approve:
    post:
      operationId: approveImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalInput" }
      responses:
        "200":
          description: Approved transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/reject:
    post:
      operationId: rejectImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rejected import retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/issues/{page}:
    get:
      operationId: listImportIssues
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Paginated issue report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
  /import-templates:
    get:
      operationId: listImportTemplates
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: source, in: query, schema: { type: string } }
      responses:
        "200":
          description: Factory mapping templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplatePage" }
    post:
      operationId: createImportTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: New immutable template version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MappingTemplate" }
  /imports/{id}/event-codes:
    post:
      operationId: inspectEventCodes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingInput" }
      responses:
        "200":
          description: Complete distinct event-code inventory for the selected column
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /imports/{id}/errors:
    get:
      operationId: getImportErrors
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Errors requiring explicit approval acknowledgement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
  /imports/{id}/review-page:
    post:
      operationId: readImportReviewPage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportReviewSelection" }
      responses:
        "200":
          description: Stable server page, fixed maximum 20 items. Nested collections are previews and have their own selectable collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReviewPage" }
        "404":
          description: Import or issue is not in this factory.
  /data-sources:
    get:
      operationId: listDataSources
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Factory sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /data-sources/recommend:
    post:
      operationId: recommendDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200":
          description: Most recent matching active approved source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /data-sources/archive:
    patch:
      operationId: archiveDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200":
          description: Manager-only archive status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /source-runs:
    get:
      operationId: listSourceRuns
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Active source-qualified runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /source-comparison:
    get:
      operationId: getSourceComparison
      parameters:
        - { name: left, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: right, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Source-qualified pair identities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Session including CSRF token, also available before login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Logged out }
  /preferences:
    patch:
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /active-factory:
    post:
      operationId: selectFactory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorySelection" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /factories/{factoryId}/pages/{page}:
    get:
      operationId: getPage
      parameters:
        - { name: factoryId, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authorized empty page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageState" }
  /snapshots:
    get:
      operationId: listSnapshots
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Frozen comparisons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotList" }
    post:
      operationId: saveSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotInput" }
      responses:
        "201":
          description: Immutable saved comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotDetail" }
  /snapshots/{id}:
    get:
      operationId: getSnapshot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Frozen payload plus separate current-data changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotDetail" }
  /reconciliations:
    get:
      operationId: listReconciliations
      parameters:
        - { name: snapshotId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Immutable reconciliation history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationList" }
  /snapshots/{id}/report:
    post:
      operationId: prepareSnapshotReport
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapshotReportInput" }
      responses:
        "200":
          description: Bounded frozen report prepared for browser Save as PDF
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotReport" }
        "404":
          description: Snapshot not found in the active factory
        "413":
          description: Snapshot or reconciliation history exceeds printable limits
        "429":
          description: Report preparation rate exceeded
  /snapshots/{id}/reconciliations:
    post:
      operationId: addReconciliation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportFigures" }
      responses:
        "201":
          description: New record; snapshot unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationRecord" }
  /reconciliation-preview:
    post:
      operationId: previewReconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReconciliationPreviewInput" }
      responses:
        "200":
          description: Server-calculated preview, not yet saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReconciliationResult" }
  /source-detail:
    get:
      operationId: getSourceDetail
      parameters:
        - { name: snapshot, in: query, schema: { type: string, format: uuid } }
        - { name: kind, in: query, required: true, schema: { type: string, enum: [metric, issue] } }
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: metric, in: query, schema: { type: string } }
        - { name: other, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Tenant-scoped calculation explanation and original cells
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceDetail" }
components:
  schemas:
    ReportRunFigures:
      type: object
      properties:
        input_kg: { type: string, maxLength: 80 }
        good_kg: { type: string, maxLength: 80 }
        scrap_kg: { type: string, maxLength: 80 }
        changeover_min: { type: string, maxLength: 80 }
        downtime_min: { type: string, maxLength: 80 }
    ReportFigures:
      type: object
      required: [a, b]
      properties:
        a: { $ref: "#/components/schemas/ReportRunFigures" }
        b: { $ref: "#/components/schemas/ReportRunFigures" }
        origin: { type: string, maxLength: 1000 }
    SnapshotReportInput:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        language: { type: string, enum: [en, ar] }
    ReportSourceFile:
      type: object
      required: [name, sha256]
      properties:
        name: { type: string }
        sha256: { type: string }
    ReportProvenance:
      type: object
      required: [importId, files]
      properties:
        importId: { type: string }
        files:
          type: array
          items: { $ref: "#/components/schemas/ReportSourceFile" }
    SnapshotReport:
      type: object
