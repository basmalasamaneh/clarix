      type: object
      required: [en, ar]
      properties:
        en: { type: string }
        ar: { type: string }
    SourceRow:
      type: object
      required: [id, importId, sourceName, orderId, file, line, kind, cells, contributions]
      properties:
        id: { type: string }
        importId: { type: string }
        sourceName: { type: string }
        orderId: { type: [string, "null"] }
        file: { type: string }
        line: { type: integer }
        kind: { type: string, enum: [included, excluded, quarantined, related] }
        cells:
          type: array
          items:
            type: object
            required: [column, value, highlighted, reason]
            properties:
              column: { type: string }
              value: { type: string }
              highlighted: { type: boolean }
              reason: { $ref: "#/components/schemas/SourceText" }
        contributions:
          type: array
          items:
            type: object
            required: [key, value, unit]
            properties:
              key: { type: string }
              value: { type: [string, "null"] }
              unit: { type: string }
        event:
          type: object
          required: [type, start, end, minutes]
          properties:
            type: { type: string }
            start: { type: string }
            end: { type: string }
            minutes: { type: [string, "null"] }
    MetricReference:
      type: object
      required: [runId, importId, sourceName, orderId, file, line, column, kind]
      properties:
        runId: { type: string }
        importId: { type: string }
        sourceName: { type: string }
        orderId: { type: string }
        file: { type: string }
        line: { type: integer }
        column: { type: string }
        kind: { type: string, enum: [included, excluded, quarantined] }
    RunMetric:
      type: object
      required: [key, group, unit, status, value, display, hours, available, noEvents, refs, alternatives]
      properties:
        key: { type: string }
        group: { type: string, enum: [volume, changeover, downtime] }
        unit: { type: string, enum: [kg, pct, pp, min] }
        status: { type: string, enum: [green, yellow, red] }
        value: { type: [string, "null"] }
        display: { type: [string, "null"] }
        hours: { type: [string, "null"] }
        available: { type: boolean }
        noEvents: { type: boolean }
        refs:
          type: array
          items: { $ref: "#/components/schemas/MetricReference" }
        alternatives:
          type: array
          items:
            type: object
            required: [key, display]
            properties:
              key: { type: string }
              display: { type: [string, "null"] }
    RunIssue:
      type: object
      required: [id, code, severity, group, orderId, sourceName]
      properties:
        id: { type: string }
        code: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        group: { type: string }
        orderId: { type: [string, "null"] }
        sourceName: { type: string }
    ProductionRun:
      type: object
      required: [id, orderId, sourceName, importId, date, dateRefs, capabilityLevel, overall, groups, metrics, issues]
      properties:
        id: { type: string }
        orderId: { type: string }
        sourceName: { type: string }
        importId: { type: string }
        date: { type: [string, "null"] }
        dateRefs: { type: array, items: { $ref: "#/components/schemas/MetricReference" } }
        capabilityLevel: { type: integer }
        overall: { type: string, enum: [green, yellow, red] }
        groups:
          type: object
          additionalProperties: { type: string, enum: [green, yellow, red] }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/RunMetric" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/RunIssue" }
    RunComparison:
      type: object
      required: [a, b, differences, overall, groups, summary, questions, hasWarnings, hasBlockedGroups, chart_spec, indicators]
      properties:
        chart_spec: { type: array, items: { $ref: "#/components/schemas/ChartSpec" } }
        indicators: { type: array, items: { $ref: "#/components/schemas/ChartSpec" } }
        a: { $ref: "#/components/schemas/ProductionRun" }
        b: { $ref: "#/components/schemas/ProductionRun" }
        differences: { type: array, items: { $ref: "#/components/schemas/RunMetric" } }
        overall: { type: string, enum: [green, yellow, red] }
        groups:
          type: object
          additionalProperties: { type: string, enum: [green, yellow, red] }
        hasWarnings: { type: boolean }
        hasBlockedGroups: { type: boolean }
        summary:
          type: object
          required: [en, ar]
          properties:
            en: { type: string }
            ar: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [key, metricKey, en, ar]
            properties:
              key: { type: string }
              metricKey: { type: string }
              en: { type: string }
              ar: { type: string }
