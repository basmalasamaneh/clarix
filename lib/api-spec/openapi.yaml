        items:
          type: array
          items: { $ref: "#/components/schemas/QualityIssue" }
        page: { type: integer }
        total: { type: integer }
        summary:
          type: object
          required: [errors, warnings, notes, orders]
          properties:
            errors: { type: integer }
            warnings: { type: integer }
            notes: { type: integer }
            orders:
              type: object
              required: [green, yellow, red]
              properties:
                green: { type: integer }
                yellow: { type: integer }
                red: { type: integer }
