openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /members:
    get:
      operationId: getMembers
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Factory members
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Member" } }
                  total: { type: integer }
                  page: { type: integer }
  /members/{id}:
    patch:
      operationId: updateMember
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /members/invitations:
    get:
      operationId: getInvitations
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Pending invitations, including expired links
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
                  total: { type: integer }
                  page: { type: integer }
    post:
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: One-time link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationLink" }
  /members/invitations/{id}/revoke:
    post:
      operationId: revokeInvitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
  /members/invitations/{id}/reissue:
    post:
      operationId: reissueInvitation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Replacement one-time link; old invitation revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationLink" }
  /members/audit:
    get:
      operationId: getMemberAudit
      responses:
        "200":
          description: Latest 50 factory account audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountAudit" }
  /auth/invitation:
    get:
      operationId: getInvitationDetails
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Valid invitation only; invalid tokens return neutral 404
          content:
            application/json:
              schema:
                type: object
                required: [factoryName, role, email, expiresAt]
                properties:
                  factoryName: { type: string }
                  role: { $ref: "#/components/schemas/MemberRole" }
                  email: { type: string }
                  expiresAt: { type: string }
    post:
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationAcceptance" }
      responses:
        "200":
          description: Accepted and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "200":
          description: Password changed, other sessions invalidated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout-everywhere:
    post:
      operationId: logoutEverywhere
      responses:
        "204": { description: All sessions invalidated }
  /runs:
    get:
      operationId: listProductionRuns
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [green, yellow, red] } }
        - { name: sort, in: query, schema: { type: string, enum: [order, status] } }
      responses:
        "200":
          description: Current approved active runs
          content:
            application/json:
              schema:
                type: object
                required: [items, page, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ProductionRun" } }
                  page: { type: integer }
                  total: { type: integer }
  /runs/{id}:
    get:
      operationId: getProductionRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Factory-scoped current run and metric lineage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductionRun" }
        "404": { description: Not found }
  /comparison:
    get:
      operationId: getRunComparison
      parameters:
        - { name: a, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: b, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: B minus A, refusing only blocked metric groups
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunComparison" }
        "404": { description: Not found }
  /quality:
    get:
      operationId: getQuality
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: severity, in: query, schema: { type: string, enum: [info, warning, error] } }
        - { name: group, in: query, schema: { type: string, enum: [volume, changeover, downtime, file, import, all] } }
        - { name: order, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: includeArchived, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Approved issue history and current-order counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityPage" }
  /quality/{id}:
    get:
      operationId: getQualityIssue
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Approved issue with exact source cells
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QualityIssue" }
        "404":
          description: Not found in this factory
  /imports:
    get:
      operationId: listImports
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Factory import page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPage" }
    post:
      operationId: createImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportInput" }
      responses:
        "201":
          description: Draft and short-lived direct upload URLs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/config:
    get:
      operationId: getImportConfig
      responses:
        "200":
          description: Limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportLimits" }
  /imports/{id}:
    get:
      operationId: getImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Draft or completed import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/finalize:
    post:
      operationId: finalizeImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Parsed originals and suggested mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/mapping:
    put:
      operationId: saveImportMapping
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingInput" }
      responses:
        "200":
          description: Saved draft mapping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/check:
    post:
      operationId: checkImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Checked import
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/approve:
    post:
      operationId: approveImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalInput" }
      responses:
        "200":
          description: Approved transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/reject:
    post:
      operationId: rejectImport
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Rejected import retained
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportDetail" }
  /imports/{id}/issues/{page}:
    get:
      operationId: listImportIssues
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Paginated issue report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
  /import-templates:
    get:
      operationId: listImportTemplates
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: source, in: query, schema: { type: string } }
      responses:
        "200":
          description: Factory mapping templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplatePage" }
    post:
      operationId: createImportTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplateInput" }
      responses:
        "201":
          description: New immutable template version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MappingTemplate" }
  /imports/{id}/event-codes:
    post:
      operationId: inspectEventCodes
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingInput" }
      responses:
        "200":
          description: Complete distinct event-code inventory for the selected column
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /imports/{id}/errors:
    get:
      operationId: getImportErrors
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Errors requiring explicit approval acknowledgement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
  /data-sources:
    get:
      operationId: listDataSources
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Factory sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /data-sources/recommend:
    post:
      operationId: recommendDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200":
          description: Most recent matching active approved source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /data-sources/archive:
    patch:
      operationId: archiveDataSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonObject" }
      responses:
        "200":
          description: Manager-only archive status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /source-runs:
    get:
      operationId: listSourceRuns
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        "200":
          description: Active source-qualified runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /source-comparison:
    get:
      operationId: getSourceComparison
      parameters:
        - { name: left, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: right, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Source-qualified pair identities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Session including CSRF token, also available before login
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Logged out }
  /preferences:
    patch:
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Preferences" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /active-factory:
    post:
      operationId: selectFactory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorySelection" }
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /factories/{factoryId}/pages/{page}:
    get:
      operationId: getPage
      parameters:
        - { name: factoryId, in: path, required: true, schema: { type: string } }
        - { name: page, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authorized empty page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PageState" }
  /source-detail:
    get:
      operationId: getSourceDetail
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [metric, issue] } }
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: metric, in: query, schema: { type: string } }
        - { name: other, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Tenant-scoped calculation explanation and original cells
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceDetail" }
components:
  schemas:
    MemberRole:
      type: string
      enum: [factory_manager, analyst, viewer]
    Member:
      type: object
      required: [id, name, email, role, active, lastLogin, loginSuccessCount, loginFailureCount]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/MemberRole" }
        active: { type: boolean }
        lastLogin: { type: [string, "null"] }
        loginSuccessCount: { type: integer }
        loginFailureCount: { type: integer }
    MemberUpdate:
      type: object
      properties:
        role: { $ref: "#/components/schemas/MemberRole" }
        active: { type: boolean }
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: "#/components/schemas/MemberRole" }
    Invitation:
      type: object
      required: [id, email, role, status, createdAt, expiresAt]
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/MemberRole" }
        status: { type: string, enum: [pending, expired] }
        createdAt: { type: string }
        expiresAt: { type: string }
    InvitationLink:
      type: object
      required: [invitation, path]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        path: { type: string }
    InvitationAcceptance:
      type: object
      required: [token, name, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 12, maxLength: 256 }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 256 }
        newPassword: { type: string, minLength: 12, maxLength: 256 }
    AccountAudit:
      type: object
      required: [id, action, actorName, subjectName, createdAt, role, count]
      properties:
        id: { type: string }
        action: { type: string }
        actorName: { type: [string, "null"] }
        subjectName: { type: [string, "null"] }
        createdAt: { type: string }
        role: { type: [string, "null"] }
        count: { type: integer }
    SourceDetail:
      type: object
      required: [key, value, display, unit, formula, inputs, breakdown, rows, total, page, imports, issues, alternatives, notes, duplicatePairs]
      properties:
        key: { type: string }
        value: { type: [string, "null"] }
        display: { type: [string, "null"] }
        unit: { type: string }
        formula: { $ref: "#/components/schemas/SourceText" }
        inputs:
          type: array
          items:
            type: object
            required: [key, value, unit]
            properties:
              key: { type: string }
              value: { type: [string, "null"] }
              unit: { type: string }
        breakdown: { $ref: "#/components/schemas/SourceText" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/SourceText" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/SourceRow" }
        total: { type: integer }
        page: { type: integer }
        imports:
          type: array
          items:
            type: object
            required: [id, sourceName, orderId, approvedAt]
            properties:
              id: { type: string }
              sourceName: { type: string }
              orderId: { type: [string, "null"] }
              approvedAt: { type: string }
        issues:
          type: array
          items: { $ref: "#/components/schemas/RunIssue" }
        alternatives:
          type: array
          items:
            type: object
            required: [key, metric, value, unit]
            properties:
              key: { type: string }
              metric: { type: string }
              value: { type: [string, "null"] }
              unit: { type: string }
        duplicatePairs:
          type: array
          items:
            type: object
            required: [original, suspected]
            properties:
              original: { $ref: "#/components/schemas/SourceRow" }
              suspected: { $ref: "#/components/schemas/SourceRow" }
    SourceText:
      type: object
      required: [en, ar]
      properties:
        en: { type: string }
        ar: { type: string }
    SourceRow:
      type: object
      required: [id, importId, sourceName, orderId, file, line, kind, cells, contributions]
      properties:
        id: { type: string }
        importId: { type: string }
        sourceName: { type: string }
        orderId: { type: [string, "null"] }
        file: { type: string }
        line: { type: integer }
        kind: { type: string, enum: [included, excluded, quarantined, related] }
        cells:
          type: array
          items:
            type: object
            required: [column, value, highlighted, reason]
            properties:
              column: { type: string }
              value: { type: string }
              highlighted: { type: boolean }
              reason: { $ref: "#/components/schemas/SourceText" }
        contributions:
          type: array
          items:
            type: object
            required: [key, value, unit]
            properties:
              key: { type: string }
              value: { type: [string, "null"] }
              unit: { type: string }
        event:
          type: object
          required: [type, start, end, minutes]
          properties:
            type: { type: string }
            start: { type: string }
            end: { type: string }
            minutes: { type: [string, "null"] }
    MetricReference:
      type: object
      required: [runId, importId, sourceName, orderId, file, line, column, kind]
      properties:
        runId: { type: string }
        importId: { type: string }
        sourceName: { type: string }
        orderId: { type: string }
        file: { type: string }
        line: { type: integer }
        column: { type: string }
        kind: { type: string, enum: [included, excluded, quarantined] }
    RunMetric:
      type: object
      required: [key, group, unit, status, value, display, hours, available, noEvents, refs, alternatives]
      properties:
        key: { type: string }
        group: { type: string, enum: [volume, changeover, downtime] }
        unit: { type: string, enum: [kg, pct, pp, min] }
        status: { type: string, enum: [green, yellow, red] }
        value: { type: [string, "null"] }
        display: { type: [string, "null"] }
        hours: { type: [string, "null"] }
        available: { type: boolean }
        noEvents: { type: boolean }
        refs:
          type: array
          items: { $ref: "#/components/schemas/MetricReference" }
        alternatives:
          type: array
          items:
            type: object
            required: [key, display]
            properties:
              key: { type: string }
              display: { type: [string, "null"] }
    RunIssue:
      type: object
      required: [id, code, severity, group, orderId, sourceName]
      properties:
        id: { type: string }
        code: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        group: { type: string }
        orderId: { type: [string, "null"] }
        sourceName: { type: string }
    ProductionRun:
      type: object
      required: [id, orderId, sourceName, importId, date, dateRefs, capabilityLevel, overall, groups, metrics, issues]
      properties:
        id: { type: string }
        orderId: { type: string }
        sourceName: { type: string }
        importId: { type: string }
        date: { type: [string, "null"] }
        dateRefs: { type: array, items: { $ref: "#/components/schemas/MetricReference" } }
        capabilityLevel: { type: integer }
        overall: { type: string, enum: [green, yellow, red] }
        groups:
          type: object
          additionalProperties: { type: string, enum: [green, yellow, red] }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/RunMetric" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/RunIssue" }
    RunComparison:
      type: object
      required: [a, b, differences, overall, groups, summary, questions, hasWarnings, hasBlockedGroups]
      properties:
        a: { $ref: "#/components/schemas/ProductionRun" }
        b: { $ref: "#/components/schemas/ProductionRun" }
        differences: { type: array, items: { $ref: "#/components/schemas/RunMetric" } }
        overall: { type: string, enum: [green, yellow, red] }
        groups:
          type: object
          additionalProperties: { type: string, enum: [green, yellow, red] }
        hasWarnings: { type: boolean }
        hasBlockedGroups: { type: boolean }
        summary:
          type: object
          required: [en, ar]
          properties:
            en: { type: string }
            ar: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [key, metricKey, en, ar]
            properties:
              key: { type: string }
              metricKey: { type: string }
              en: { type: string }
              ar: { type: string }
    QualityIssue:
      type: object
      required: [id, importId, code, severity, severityStatus, sourceName, group, orderId, archived, superseded, refs, blockedReasons]
      properties:
        id: { type: string }
        importId: { type: string }
        code: { type: string }
        severity: { type: string, enum: [info, warning, error] }
        severityStatus: { type: string, enum: [green, yellow, red] }
        sourceName: { type: string }
        group: { type: string }
        orderId: { type: [string, "null"] }
        approvedAt: { type: string }
        archived: { type: boolean }
        superseded: { type: boolean }
        comparable: { type: [boolean, "null"] }
        overallStatus: { type: [string, "null"], enum: [green, yellow, red, null] }
        groupStatuses:
          type: [object, "null"]
          additionalProperties: { type: string }
        blockedReasons:
          type: array
          items: { type: string }
        refs:
          type: array
          items:
            type: object
            required: [file, line]
            properties:
              file: { type: string }
              line: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [file, line, cells, references]
            properties:
              file: { type: string }
              line: { type: integer }
              cells:
                type: object
                additionalProperties: {}
              references:
                type: array
                items: { type: string }
    QualityPage:
      type: object
      required: [items, page, total, summary]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QualityIssue" }
        page: { type: integer }
        total: { type: integer }
        summary:
          type: object
          required: [errors, warnings, notes, orders]
          properties:
            errors: { type: integer }
            warnings: { type: integer }
            notes: { type: integer }
            orders:
              type: object
              required: [green, yellow, red]
              properties:
                green: { type: integer }
                yellow: { type: integer }
                red: { type: integer }
    JsonObject:
      type: object
      additionalProperties: true
    ImportInput:
      type: object
      required: [sourceName, files]
      properties:
        sourceName: { type: string, minLength: 1, maxLength: 120 }
        files:
          type: array
          minItems: 2
          maxItems: 4
          items: { $ref: "#/components/schemas/FileInput" }
    FileInput:
      type: object
      required: [name, size, mime]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1 }
        mime: { type: string }
    ImportFile:
      allOf:
        - { $ref: "#/components/schemas/FileInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string }
            uploadUrl: { type: string }
            sha256: { type: string }
            encoding: { type: string }
            delimiter: { type: string }
            rowCount: { type: integer }
            header: { type: array, items: { type: string } }
            preview:
              type: array
              items: { $ref: "#/components/schemas/PreviewRow" }
    PreviewRow:
      type: object
      required: [start_line, end_line, cells]
      properties:
        start_line: { type: integer }
        end_line: { type: integer }
        cells: { type: object, additionalProperties: { type: string } }
    ImportDetail:
      type: object
      required: [id, sourceName, status, createdAt, files, progress, finalized, replacementCount]
      properties:
        id: { type: string }
        sourceName: { type: string }
        status: { type: string, enum: [draft, checked, approved, rejected] }
        createdAt: { type: string }
        files: { type: array, items: { $ref: "#/components/schemas/ImportFile" } }
        progress: { type: integer }
        finalized: { type: boolean }
        replacementCount: { type: integer }
        duplicateOf: { type: [string, "null"] }
        duplicateReason: { type: [string, "null"] }
        sourceArchived: { type: boolean }
        otherSourceOrders: { type: array, items: { $ref: "#/components/schemas/JsonObject" } }
        settingsDifferences: { type: array, items: { $ref: "#/components/schemas/JsonObject" } }
        comparisonSource: { type: [string, "null"] }
        replacementOrders: { type: array, items: { type: string } }
        replacedOrders: { type: array, items: { type: string } }
        mapping: { $ref: "#/components/schemas/JsonObject" }
        result: { $ref: "#/components/schemas/JsonObject" }
        samples:
          type: array
          items: { $ref: "#/components/schemas/MappingSample" }
        counts: { $ref: "#/components/schemas/IssueCounts" }
    MappingSample:
      type: object
      required: [file, line, column, raw, value, unit]
      properties:
        file: { type: string }
        line: { type: integer }
        column: { type: string }
        raw: { type: string }
        value: { type: [string, "null"] }
        unit: { type: string }
    IssueCounts:
      type: object
      required: [info, warning, error]
      properties:
        info: { type: integer }
        warning: { type: integer }
        error: { type: integer }
    ImportPage:
      type: object
      required: [items, page, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImportDetail" } }
        page: { type: integer }
        total: { type: integer }
    ImportLimits:
      type: object
      required: [maxFileBytes, maxTotalBytes, maxFiles]
      properties:
        maxFileBytes: { type: integer }
        maxTotalBytes: { type: integer }
        maxFiles: { type: integer }
    MappingInput:
      type: object
      required: [mapping]
      properties:
        mapping: { $ref: "#/components/schemas/JsonObject" }
    ApprovalInput:
      type: object
      required: [confirmReplacement, replacementCount]
      properties:
        confirmReplacement: { type: boolean }
        confirmErrors: { type: boolean }
        replacementCount: { type: integer, minimum: 0 }
    TemplateInput:
      type: object
      required: [sourceName, name, mapping]
      properties:
        sourceName: { type: string, minLength: 1, maxLength: 120 }
        name: { type: string, minLength: 1, maxLength: 120 }
        mapping: { $ref: "#/components/schemas/JsonObject" }
    MappingTemplate:
      allOf:
        - { $ref: "#/components/schemas/TemplateInput" }
        - type: object
          required: [id, version]
          properties:
            id: { type: string }
            version: { type: integer }
    TemplatePage:
      type: object
      required: [items, page, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MappingTemplate" } }
        page: { type: integer }
        total: { type: integer }
    ImportIssue:
      type: object
      required: [code, severity, refs, order, group]
      properties:
        code: { type: string }
        severity: { type: string }
        order: { type: [string, "null"] }
        group: { type: string }
        refs: { type: array, items: { type: string } }
    IssuePage:
      type: object
      required: [items, page, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ImportIssue" } }
        page: { type: integer }
        total: { type: integer }
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
    Preferences:
      type: object
      additionalProperties: false
      properties:
        language: { type: string, enum: [en, ar] }
        theme: { type: string, enum: [light, dark, system] }
        tourCompleted: { type: boolean }
    FactorySelection:
      type: object
      additionalProperties: false
      required: [factoryId]
      properties:
        factoryId: { type: string }
    Membership:
      type: object
      required: [factoryId, factoryName, role]
      properties:
        factoryId: { type: string }
        factoryName: { type: string }
        role: { type: string, enum: [factory_manager, analyst, viewer] }
    User:
      type: object
      required: [id, email, name, platformAdmin, language, theme, tourCompleted]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        platformAdmin: { type: boolean }
        language: { type: string, enum: [en, ar] }
        theme: { type: string, enum: [light, dark, system] }
        tourCompleted: { type: boolean }
    Session:
      type: object
      required: [user, csrfToken, memberships, activeFactoryId, allowedPages]
      properties:
        user:
          anyOf:
            - { $ref: "#/components/schemas/User" }
            - { type: "null" }
        csrfToken: { type: string }
        activeFactoryId: { type: [string, "null"] }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
        allowedPages:
          type: array
          items: { type: string }
    PageState:
      type: object
      required: [page, factoryId, state]
      properties:
        page: { type: string }
        factoryId: { type: string }
        state: { type: string, enum: [empty] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

