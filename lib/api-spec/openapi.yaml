              file: { type: string }
              line: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [file, line, cells, references]
            properties:
              file: { type: string }
              line: { type: integer }
              cells:
                type: object
                additionalProperties: {}
              references:
                type: array
                items: { type: string }
